[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sixi-observer"
version = "0.1.1"
description = "Open-source MeshCore / LoRa observer bridge for Sixi AI Map (map.sixi.ai)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sixi AI", email = "open-source@sixi.ch" }]
dependencies = [
    "pyserial>=3.5",
    "websockets>=12.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sixi-observer = "sixi_observer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sixi_observer"]

[tool.ruff]
line-length = 100
target-version = "py310"
